site_name: Java Backend Roadmap
site_description: Ghi chú học Java, từ cú pháp cơ bản đến backend production-ready — 33 module.
site_author: Gia Pho Huynh
repo_url: https://github.com/giaph4/java-backend-roadmap
repo_name: giaph4/java-backend-roadmap
edit_uri: edit/main/

# LƯU Ý QUAN TRỌNG: mkdocs.yml đặt trong docs-site/ (không phải gốc repo) vì MkDocs
# không cho phép docs_dir trùng (hoặc là thư mục cha trực tiếp của) thư mục chứa
# chính file mkdocs.yml. docs_dir trỏ ngược lên gốc repo (`..`) để dùng thẳng các
# thư mục module hiện có — KHÔNG copy nội dung sang thư mục riêng, một nguồn duy nhất.
#
# Build từ gốc repo bằng:  mkdocs build --strict -f docs-site/mkdocs.yml --site-dir <thư mục output>
# Xem trước cục bộ bằng:   mkdocs serve -f docs-site/mkdocs.yml
docs_dir: ..
site_dir: ../../mkdocs-site-output

exclude_docs: |
  .git/
  .github/
  .idea/
  out/
  docs-site/
  *.iml
  src/
  *.java
  scripts/
  .markdownlint.yml
  README.MD

nav:
  - Trang chủ: index.md
  - Giai đoạn 1 — Ngôn ngữ Java:
      - "01 · Cú pháp & kiểu dữ liệu": 01-cu-phap-kieu-du-lieu/01-cu-phap-kieu-du-lieu.md
      - "02 · Cấu trúc điều khiển": 02-cau-truc-dieu-khien/02-cau-truc-dieu-khien.md
      - "03 · Class, Object, Method": 03-class-object-method/03-class-object-method.md
      - "04 · 4 trụ cột OOP": 04-4-tru-cot-oop/04-4-tru-cot-oop.md
      - "05 · Interface vs Abstract Class": 05-interface-vs-abstract-class/05-interface-vs-abstract-class.md
      - "06 · SOLID Principles": 06-solid-principles/06-solid-principles.md
      - "07 · equals / hashCode / toString": 07-equals-hashcode-tostring/07-equals-hashcode-tostring.md
  - Giai đoạn 2 — Thư viện chuẩn & Java hiện đại:
      - "08 · Collections Framework": 08-collections-framework/08-collections-framework.md
      - "09 · Generics": 09-generics/09-generics.md
      - "10 · Stream API & Lambda": 10-stream-api-lambda/10-stream-api-lambda.md
      - "11 · Exception Handling, I/O & Networking": 11-exception-handling-io/11-exception-handling-io.md
      - "12 · Thread cơ bản": 12-thread-co-ban/12-thread-co-ban.md
      - "13 · Concurrency Utilities": 13-concurrency-utilities/13-concurrency-utilities.md
      - "14 · Java hiện đại (9 → 21)": 14-java-modern/14-java-modern.md
  - Giai đoạn 3 — Bên dưới lớp vỏ ngôn ngữ:
      - "15 · JVM Internals": 15-jvm-internals/15-jvm-internals.md
      - "16 · Design Patterns": 16-design-patterns/16-design-patterns.md
      - "17 · Build Tools & quản lý dự án": 17-build-tools-quan-ly-du-an/17-build-tools-quan-ly-du-an.md
  - Giai đoạn 4 — Dữ liệu:
      - "18 · Database & SQL": 18-database-sql/18-database-sql.md
      - "19 · RDBMS vs NoSQL": 19-rdbms-nosql/19-rdbms-nosql.md
      - "20 · JPA / Hibernate": 20-jpa-hibernate/20-jpa-hibernate.md
  - Giai đoạn 5 — Spring:
      - "21 · Spring Core (IoC, DI, AOP)": 21-spring-core/21-spring-core.md
      - "22 · Spring Boot": 22-spring-boot/22-spring-boot.md
      - "23 · RESTful API Design": 23-restful-api-design/23-restful-api-design.md
      - "24 · Spring Data & Persistence": 24-spring-data-persistence/24-spring-data-persistence.md
      - "25 · Spring Security": 25-spring-security/25-spring-security.md
  - Giai đoạn 6 — Chất lượng & vận hành:
      - "26 · Testing": 26-testing/26-testing.md
      - "27 · Caching & Messaging": 27-caching-messaging/27-caching-messaging.md
      - "28 · Microservices": 28-microservices/28-microservices.md
      - "29 · DevOps cơ bản": 29-devops-co-ban/29-devops-co-ban.md
      - "30 · Observability": 30-observability/30-observability.md
  - Giai đoạn 7 — Kiến trúc & sự nghiệp:
      - "31 · System Design": 31-system-design/31-system-design.md
      - "32 · Bảo mật — OWASP Top 10": 32-bao-mat-owasp/32-bao-mat-owasp.md
      - "33 · Soft Skills & Career": 33-soft-skills-career/33-soft-skills-career.md
  - Knowledge Graph: knowledge-graph.md

theme:
  name: material
  language: vi
  icon:
    repo: fontawesome/brands/github
    logo: material/school
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - toc.follow

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - vi
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/giaph4
  generator: false

extra_css:
  - assets/extra.css
