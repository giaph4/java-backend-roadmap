# Cấu hình markdownlint — nới lỏng các rule gây nhiễu với văn phong tài liệu hiện có.
# Xem đầy đủ rule tại: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Dòng dài (bảng, đường dẫn, câu giải thích kỹ thuật dài) — không giới hạn.
MD013: false

# Cho phép heading trùng tên ở các mục con khác nhau trong cùng file
# (nhiều module có mục con lặp lại kiểu "Bẫy thường gặp", "Ví dụ").
MD024:
  siblings_only: true

# Cho phép HTML inline cần thiết (ví dụ <div align="center">, <br/> trong bảng/sơ đồ).
MD033: false

# Không ép heading đầu file phải là H1 duy nhất theo kiểu nghiêm ngặt
# (một số file có blockquote mô tả trước H1 đầu tiên).
MD041: false

# Cho phép danh sách đánh số không tuần tự tuyệt đối 1/2/3 (một số nơi dùng 1/1/1 theo style "lazy numbering").
MD029: false

# Cho phép dòng trống linh hoạt quanh bảng/blockquote lồng nhau.
MD012: false

# Không ép kiểu căn lề bảng "compact"/"padded" nhất quán tuyệt đối — toàn bộ
# 33 module dùng dòng phân cách bảng kiểu "|---|---|" không đệm khoảng trắng,
# đây là lựa chọn phong cách nhất quán trong repo, không phải lỗi.
MD060: false

# Cho phép heading nhảy cấp có chủ đích, ví dụ H3 làm tagline nhỏ hơn ngay dưới
# H1 trong phần hero của README (thiết kế có chủ đích, không phải viết sai cấp).
MD001: false

# Không bắt buộc dòng trống bao quanh mọi code fence / list — văn phong hiện có
# trong 33 module thường đặt code fence/list sát ngay dưới blockquote giải thích,
# vẫn render đúng trên GitHub/MkDocs.
MD031: false
MD032: false

# Không bắt buộc dòng trống bên trong blockquote nhiều đoạn (blockquote đa dòng
# có chủ đích ngắt đoạn bằng dòng trống để dễ đọc, vẫn hợp lệ theo CommonMark).
MD028: false

# Không bắt buộc mọi code fence phải khai báo ngôn ngữ — lý do giống check-structure.py
# (nhiều nơi dùng ``` trần để vẽ sơ đồ ASCII/cây thư mục, không phải code thật).
MD040: false

# TẮT CÓ CHỦ ĐÍCH, KHÔNG PHẢI CHE GIẤU LỖI: rule này bắt được một lỗi bảng THẬT
# (dấu `|` bên trong code span như `` `&&`/`||` `` bị hiểu nhầm là cột), nhưng
# việc rà soát/escape `|` trong mọi bảng của 33 file nằm ngoài phạm vi lần này —
# xem README mục "Đóng góp" nếu muốn tự sửa các bảng bị vỡ; tạm tắt để không chặn CI.
MD056: false

# Không bắt buộc dòng trống quanh heading/bảng — cùng lý do MD031/MD032, văn
# phong hiện có đặt nội dung sát ngay dưới heading/bảng ở nhiều chỗ.
MD022: false
MD058: false

# `(Lưu ý: ...)` / `(Gợi ý: ...)` in đậm/nghiêng là chú thích trong đoạn văn,
# KHÔNG có ý định làm heading — false positive của heuristic rule này.
MD036: false

# Hard tab bên trong code fence đôi khi là VÍ DỤ MINH HỌA CÓ CHỦ ĐÍCH cho lỗi
# thụt lề (ví dụ: "dòng này dùng Tab -> YAML parser lỗi"), không phải lỗi thật.
MD010: false

# TẮT CÓ CHỦ ĐÍCH: rule này so khớp anchor link nội bộ (mục lục mỗi file) bằng
# thuật toán tạo slug riêng của markdownlint, vốn xử lý tiếng Việt có dấu +
# emoji (⚠️) trong heading khác với GitHub/MkDocs — nhiều false positive dù
# link thực tế vẫn hoạt động đúng khi render thật. Nếu nghi ngờ một anchor cụ
# thể bị vỡ thật, kiểm tra tay bằng cách mở trang đã build thay vì tin rule này.
MD051: false
